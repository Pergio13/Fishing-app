name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Push code
        run: clasp push -f
        env:
          CLASP_DOT_CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          
